<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blockchain Node</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card: #12161f;
      --border: #1e2533;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    .container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 1.4rem; font-weight: 600; }
    .badge {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }
    .card h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .address {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9rem;
      word-break: break-all;
      background: #0d1117;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 10px;
    }
    .balance {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--success);
    }
    .balance span { font-size: 0.9rem; color: var(--muted); font-weight: 400; }
    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      background: #0d1117;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }
    input:focus { outline: none; border-color: var(--accent); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-success { background: #15803d; }
    .btn-success:hover { background: #166534; }
    .btn-full { width: 100%; }
    .stats {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .stat {
      flex: 1;
      min-width: 100px;
    }
    .stat .value { font-size: 1.3rem; font-weight: 600; }
    .stat .label { font-size: 0.75rem; color: var(--muted); }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th {
      text-align: left;
      color: var(--muted);
      font-weight: 500;
      padding: 8px 6px;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 10px 6px;
      border-bottom: 1px solid var(--border);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
    }
    tr:last-child td { border-bottom: none; }
    .hash { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .msg {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
    }
    .msg.ok { display: block; background: #052e16; color: #86efac; border: 1px solid #166534; }
    .msg.err { display: block; background: #450a0a; color: #fca5a5; border: 1px solid #991b1b; }
    .full-width { grid-column: 1 / -1; }
    .refresh-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⛓ Blockchain Node</h1>
      <div class="badge" id="network-badge">mainnet</div>
    </header>

    <div class="grid">
      <!-- Wallet -->
      <div class="card">
        <h2>Your Wallet</h2>
        <div class="address" id="address">Loading...</div>
        <div class="balance" id="balance">— <span>coins</span></div>
      </div>

      <!-- Network -->
      <div class="card">
        <h2>Network</h2>
        <div class="stats">
          <div class="stat">
            <div class="value" id="height">—</div>
            <div class="label">Block Height</div>
          </div>
          <div class="stat">
            <div class="value" id="peers">—</div>
            <div class="label">Peers</div>
          </div>
          <div class="stat">
            <div class="value" id="pending">—</div>
            <div class="label">Pending Txs</div>
          </div>
        </div>
      </div>

      <!-- Send -->
      <div class="card">
        <h2>Send Coins</h2>
        <label>Recipient Address</label>
        <input type="text" id="recipient" placeholder="1..." />
        <label>Amount</label>
        <input type="number" id="amount" placeholder="0.00" step="0.01" min="0" />
        <button class="btn btn-full" onclick="sendTx()">Send Transaction</button>
        <div class="msg" id="send-msg"></div>
      </div>

      <!-- Mine -->
      <div class="card">
        <h2>Mining</h2>
        <p style="color:var(--muted);font-size:0.9rem;margin-bottom:14px;">
          Mine the next block and collect the block reward.
        </p>
        <button class="btn btn-success btn-full" id="mine-btn" onclick="mineBlock()">
          Mine Block
        </button>
        <div class="msg" id="mine-msg"></div>
      </div>

      <!-- Explorer -->
      <div class="card full-width">
        <div class="refresh-bar">
          <h2 style="margin:0">Recent Blocks</h2>
          <button class="btn" onclick="refresh()" style="padding:6px 12px;font-size:0.8rem;">Refresh</button>
        </div>
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Hash</th>
                <th>Txs</th>
                <th>Nonce</th>
                <th>Time</th>
              </tr>
            </thead>
            <tbody id="blocks-body">
              <tr><td colspan="5" style="color:var(--muted)">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function api(path, options = {}) {
      const res = await fetch(path, {
        headers: { "Content-Type": "application/json" },
        ...options
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
      return data;
    }

    function short(hash) {
      if (!hash) return "—";
      return hash.slice(0, 10) + "…" + hash.slice(-6);
    }

    function showMsg(id, text, ok = true) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = "msg " + (ok ? "ok" : "err");
      setTimeout(() => el.className = "msg", 6000);
    }

    async function refresh() {
      try {
        const status = await api("/api/status");
        document.getElementById("address").textContent = status.address || "—";
        document.getElementById("balance").innerHTML = `${status.balance ?? 0} <span>coins</span>`;
        document.getElementById("height").textContent = status.height ?? 0;
        document.getElementById("peers").textContent = status.peers ?? 0;
        document.getElementById("pending").textContent = status.pending ?? 0;

        const chain = await api("/api/chain");
        const tbody = document.getElementById("blocks-body");
        const recent = chain.slice(-12).reverse();
        if (recent.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="color:var(--muted)">No blocks yet</td></tr>`;
          return;
        }
        tbody.innerHTML = recent.map(b => {
          const time = new Date(b.timestamp * 1000).toLocaleString();
          return `<tr>
            <td>${b.index}</td>
            <td class="hash" title="${b.hash}">${short(b.hash)}</td>
            <td>${b.transactions?.length ?? 0}</td>
            <td>${b.nonce}</td>
            <td>${time}</td>
          </tr>`;
        }).join("");
      } catch (e) {
        console.error(e);
      }
    }

    async function sendTx() {
      const recipient = document.getElementById("recipient").value.trim();
      const amount = parseFloat(document.getElementById("amount").value);
      if (!recipient || !amount || amount <= 0) {
        showMsg("send-msg", "Enter a valid recipient and amount", false);
        return;
      }
      try {
        const res = await api("/api/send", {
          method: "POST",
          body: JSON.stringify({ recipient, amount })
        });
        showMsg("send-msg", `Sent! TxID: ${res.txid?.slice(0, 16)}…`);
        document.getElementById("amount").value = "";
        refresh();
      } catch (e) {
        showMsg("send-msg", e.message, false);
      }
    }

    async function mineBlock() {
      const btn = document.getElementById("mine-btn");
      btn.disabled = true;
      btn.textContent = "Mining…";
      try {
        const res = await api("/api/mine", { method: "POST" });
        showMsg("mine-msg", `Mined block #${res.block.index} — ${res.block.hash.slice(0, 16)}…`);
        refresh();
      } catch (e) {
        showMsg("mine-msg", e.message, false);
      } finally {
        btn.disabled = false;
        btn.textContent = "Mine Block";
      }
    }

    // Initial load + auto refresh
    refresh();
    setInterval(refresh, 15000);
  </script>
</body>
</html>
